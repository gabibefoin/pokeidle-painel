<!doctype html><meta charset="utf-8"><title>selftest</title><body><pre id="o">rodando…</pre>
<script type="module">
const PACK = 'data/asset-packs';
const localize = (p) => p.replace(/^\/assets-packs/, PACK);
const img = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error(src)); i.src = src; });

const index = await fetch(`${PACK}/outfits-index.json`).then(r => r.json());
const kinds = {};
for (const e of Object.values(index.outfits)) (kinds[e.kind] ??= []).push(e.id);
const alvos = [2, 3, 5, 25, ...Object.values(kinds).map((ids) => ids[0])];
const out = [];

for (const id of alvos) {
  const e = index.outfits[String(id)];
  if (!e) { out.push(`${id}: AUSENTE`); continue; }
  const man = await fetch(localize(e.manifest)).then(r => r.json());
  const cat = Object.values(man.categories)[0];
  const atlas = await img(localize(cat.pages[0].image));

  const byDir = {};
  let fw = 0, fh = 0;
  for (const [key, a] of Object.entries(man.assets)) {
    const stem = key.split('/').pop().replace(/\.png$/, '');
    if (stem.endsWith('_template')) continue;
    const n = stem.split('_').map(Number);
    const f = a.frames[0];
    fw = a.width; fh = a.height;
    ((byDir[n[3]] ??= [])[n[0] - 1] = { x: f.x, y: f.y, w: f.w, h: f.h });
  }

  const linhas = [];
  for (const d of Object.keys(byDir).sort()) {
    const opacos = byDir[d].filter(Boolean).map((f) => {
      const cv = document.createElement('canvas');
      cv.width = f.w; cv.height = f.h;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(atlas, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
      const px = ctx.getImageData(0, 0, f.w, f.h).data;
      let n = 0;
      for (let i = 3; i < px.length; i += 4) if (px[i] > 0) n++;
      return n;
    });
    linhas.push(`dir${d}=[${opacos.join(',')}]`);
  }
  const total = linhas.join(' ');
  const vazio = /=\[[0,]*\]/.test(total) || total.includes('[0');
  out.push(`${String(id).padStart(5)} ${e.name.padEnd(14)} atlas=${atlas.width}x${atlas.height} frame=${fw}x${fh} ${vazio ? 'FALHOU(frame vazio)' : 'OK'} ${total}`);
}

document.getElementById('o').textContent = out.join('\n');
document.title = out.every(l => l.includes('OK')) ? 'SELFTEST-OK' : 'SELFTEST-FALHOU';
</script>
