<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Lab — looktypes PokéTibia</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>Sprite Lab</h1>
      <p>espelho local de poke.idleworld.online · sprites, mapas, spawns e loot</p>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="outfits">Outfits</button>
    <button class="tab" data-tab="items">Itens</button>
    <button class="tab" data-tab="mapa">Mapa</button>
    <button class="tab" data-tab="spawns">Spawns</button>
    <button class="tab" data-tab="loot">Loot</button>
    <button class="tab" data-tab="efeitos">Efeitos</button>
    <button class="tab" data-tab="formulas">Fórmulas</button>
  </nav>
  <div class="counts" id="counts"></div>
</header>

<section class="toolbar" id="tb-outfits">
  <input type="search" id="q" placeholder="buscar por nome ou looktype…" autocomplete="off">
  <div class="chips" id="kinds"></div>
  <div class="ctl">
    <label>direção</label>
    <div class="seg" id="dirs">
      <button data-dir="1" title="norte">N</button>
      <button data-dir="2" title="leste">L</button>
      <button data-dir="3" class="on" title="sul (padrão)">S</button>
      <button data-dir="4" title="oeste">O</button>
    </div>
  </div>
  <div class="ctl">
    <label for="zoom">zoom <b id="zoomv">2×</b></label>
    <input type="range" id="zoom" min="1" max="6" step="1" value="2">
  </div>
  <label class="check"><input type="checkbox" id="anim" checked> animar</label>
  <button class="ghost" id="export-zip">exportar frames (.zip)</button>
</section>

<section class="toolbar hidden" id="tb-items">
  <input type="search" id="qi" placeholder="buscar item…" autocomplete="off">
  <div class="chips" id="cats"></div>
  <div class="ctl">
    <label for="izoom">zoom <b id="izoomv">2×</b></label>
    <input type="range" id="izoom" min="1" max="5" step="1" value="2">
  </div>
</section>

<section class="toolbar hidden" id="tb-mapa">
  <input type="search" id="qm" placeholder="buscar hunt ou cidade…" autocomplete="off">
  <div class="chips" id="areas"></div>
  <label class="check"><input type="checkbox" id="mlabels"> nomes sempre visíveis</label>
  <span class="hint">clique num marcador para ver spawns, NPCs e renderizar o mapa de tiles</span>
</section>

<section class="toolbar hidden" id="tb-spawns">
  <input type="search" id="qs" placeholder="buscar pokémon…" autocomplete="off">
  <div class="chips" id="spawnfilters"></div>
</section>

<section class="toolbar hidden" id="tb-loot">
  <input type="search" id="ql" placeholder="buscar item…" autocomplete="off">
  <div class="chips" id="lootcats"></div>
  <div class="ctl">
    <label for="lootsort">ordenar</label>
    <select id="lootsort">
      <option value="nome">nome</option>
      <option value="preco">preço (maior)</option>
      <option value="drops">nº de pokémon que dropam</option>
      <option value="chance">melhor chance de drop</option>
    </select>
  </div>
</section>

<section class="toolbar hidden" id="tb-efeitos">
  <input type="search" id="qe" placeholder="buscar ataque ou efeito…" autocomplete="off">
  <div class="chips" id="fxmodes"></div>
  <div class="chips" id="fxtypes"></div>
</section>

<section class="toolbar hidden" id="tb-formulas">
  <div class="chips" id="fmodes"></div>
  <span class="hint">extraído do bundle do cliente — detalhes e procedência em MECANICAS.md</span>
</section>

<main id="grid" class="grid"></main>
<main id="igrid" class="grid items hidden"></main>
<main id="mapa" class="mapwrap hidden"></main>
<main id="sgrid" class="grid spawns hidden"></main>
<main id="lgrid" class="lootlist hidden"></main>
<main id="egrid" class="grid fx hidden"></main>
<main id="fgrid" class="doc hidden"></main>

<div id="empty" class="empty hidden">nada encontrado</div>

<aside id="drawer" class="drawer" hidden>
  <button class="close" id="drawer-close" aria-label="fechar">×</button>
  <div id="drawer-body"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="viewer.js"></script>
</body>
</html>
