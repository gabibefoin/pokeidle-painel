<!doctype html><meta charset="utf-8"><title>maptest</title>
<style>body{background:#0e1015;color:#e6e9ef;font:13px system-ui;margin:12px}
canvas{image-rendering:pixelated;border:1px solid #333;display:block;margin:6px 0 16px}pre{color:#8b93a5}</style>
<body><pre id="o">rodando…</pre><div id="out"></div>
<script type="module">
import { renderMapa } from './mapview.mjs';

const alvos = ['bulbasaur', 'cerulean', 'lucario'];
const linhas = [];
const out = document.getElementById('out');

for (const slug of alvos) {
  const t0 = performance.now();
  try {
    const r = await renderMapa(slug, { escala: 1 });
    const ctx = r.canvas.getContext('2d');

    // amostra o centro do mapa para provar que saiu pixel de verdade, não canvas vazio
    const w = Math.min(400, r.canvas.width);
    const h = Math.min(400, r.canvas.height);
    const px = ctx.getImageData((r.canvas.width - w) / 2, (r.canvas.height - h) / 2, w, h).data;
    let opacos = 0;
    for (let i = 3; i < px.length; i += 4) if (px[i] > 0) opacos++;
    const pctOpaco = ((opacos / (w * h)) * 100).toFixed(1);

    linhas.push(
      `${slug.padEnd(12)} ${String(r.tiles).padStart(6)} tiles  ${String(r.desenhados).padStart(7)} sprites  ` +
      `faltando=${r.faltando}  canvas=${r.canvas.width}x${r.canvas.height}  ` +
      `centro ${pctOpaco}% opaco  ${((performance.now() - t0) / 1000).toFixed(1)}s  ` +
      // faltando > 0 é lacuna do atlas da origem (o cliente deles também pula esses ids),
      // então o critério é só: o canvas saiu preenchido?
      `${+pctOpaco > 50 ? 'OK' : 'SUSPEITO'}`,
    );

    // miniatura pra inspeção visual
    const mini = document.createElement('canvas');
    const s = Math.min(1, 900 / r.canvas.width);
    mini.width = r.canvas.width * s;
    mini.height = r.canvas.height * s;
    mini.getContext('2d').drawImage(r.canvas, 0, 0, mini.width, mini.height);
    out.appendChild(mini);
  } catch (e) {
    linhas.push(`${slug.padEnd(12)} FALHOU: ${e.message}`);
  }
  document.getElementById('o').textContent = linhas.join('\n');
}

document.title = linhas.every((l) => l.endsWith('OK')) ? 'MAPTEST-OK' : 'MAPTEST-FALHOU';
</script>
