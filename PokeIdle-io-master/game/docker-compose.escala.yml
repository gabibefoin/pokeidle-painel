# Postgres para a máquina de 16 vCPU / 32 GB — fases 2e/2f, até ~10 mil jogadores.
#
# Liga pelo `.env` do projeto, DEPOIS do arquivo do host (a ordem importa: o último `command` vale):
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml:docker-compose.escala.yml
#
# ### Por que num arquivo à parte
#
# O `deploy.sh` roda `docker compose up -d` em TODO deploy, e qualquer mudança no `command` do
# Postgres recria o container: o banco reinicia no meio de um deploy comum (em 04/09/2026 uma troca
# de portas do compose fez exatamente isso e derrubou os três serviços). Com o ajuste aqui, a VPS de
# 8 GB de hoje não muda nada no próximo deploy; a máquina nova já nasce com ele.
#
# ### Os números (produção, 15/09/2026, ~1.160 jogadores reais)
#
# - banco inteiro com 1,1 GB → `shared_buffers=2GB` guarda tudo e ainda folga para crescer;
# - ~10 conexões por sim e 4 no gateway → pools de 20 (sim) e 10 (gateway) nos units do systemd:
#   10 sims + 6 gateways = 260, e `max_connections=300` deixa 40 para backup, psql e ferramentas;
# - WAL de 0,65 MB/s → ~5,5 MB/s com 10 mil: `max_wal_size=8GB` espaça os checkpoints para ~25 min.
services:
  postgres:
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1,::1
      - -c
      - max_connections=300
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - max_wal_size=8GB
      - -c
      - work_mem=8MB
