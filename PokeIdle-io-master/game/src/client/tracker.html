<!-- A BARRA DO TOPO é a assinatura de um site de estatísticas: marca à esquerda, BUSCA no
     meio (o controle mais importante da página inteira) e navegação à direita. A ordem é a
     do op.gg de propósito — é o hábito que quem procura este tipo de página já tem. -->
<header class="tk-topo">
  <div class="tk-topo-int">
    <a class="tk-marca" href="/tracker" data-rota>
      <img src="/img/favicon-64.png" alt="" width="30" height="30">
      <span class="tk-marca-txt">Poké<b>Idle</b></span>
      <span class="tk-marca-selo">Tracker</span>
    </a>

    <form class="tk-busca" id="tk-busca" role="search" autocomplete="off">
      <input id="tk-q" type="search" name="q" maxlength="20" spellcheck="false"
             aria-label="Buscar treinador" placeholder="Buscar treinador…">
      <button type="submit" class="tk-bt tk-bt-busca" id="tk-busca-bt">
        <span aria-hidden="true">🔍</span><em>Buscar</em>
      </button>
      <ul class="tk-sug" id="tk-sug" role="listbox" hidden></ul>
    </form>

    <nav class="tk-nav" id="tk-nav" aria-label="seções"></nav>

    <div class="tk-topo-dir">
      <div class="tk-idiomas" id="tk-idiomas" aria-label="idioma"></div>
      <a class="tk-bt tk-bt-jogar" href="/app" id="tk-jogar">Jogar</a>
    </div>
    <button class="tk-menu-bt" id="tk-menu-bt" type="button" aria-expanded="false"
            aria-controls="tk-nav" aria-label="menu">☰</button>
  </div>
</header>

<main class="tk-main" id="tk-main">
  <!-- A tela é montada por `tracker.mjs`. O que fica no HTML é só o esqueleto e o aviso de
       quem está sem JavaScript — a página é toda dado, não há versão estática honesta dela. -->
  <noscript>
    <div class="tk-vazio">
      O Tracker precisa de JavaScript para mostrar as estatísticas.
      <a href="/app">Ir para o jogo</a>
    </div>
  </noscript>
</main>

<footer class="tk-rodape">
